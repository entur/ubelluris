[versions]
kotlin              = "2.2.20"
shadow              = "9.4.1"
ktlint              = "14.0.1"
kotlinx-serialization = "1.8.1"
entur-netex         = "0.0.46"
slf4j               = "2.0.17"
logback             = "1.5.21"
logstash            = "8.1"
google-cloud-storage = "2.54.0"
jdom2               = "2.0.6.1"
jackson             = "2.18.2"
junit-jupiter       = "5.10.2"
assertj             = "3.27.7"
mockito             = "5.12.0"
mockito-inline      = "5.2.0"
mockito-kotlin      = "5.3.1"

[libraries]
kotlinx-serialization-json   = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
entur-netex-pipeline         = { group = "org.entur.ror", name = "netex-pipeline", version.ref = "entur-netex" }
entur-netex-tools-lib        = { group = "org.entur.ror", name = "netex-tools-lib", version.ref = "entur-netex" }
slf4j-api                    = { group = "org.slf4j", name = "slf4j-api", version.ref = "slf4j" }
logback-classic              = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
logstash-logback-encoder     = { group = "net.logstash.logback", name = "logstash-logback-encoder", version.ref = "logstash" }
google-cloud-storage         = { group = "com.google.cloud", name = "google-cloud-storage", version.ref = "google-cloud-storage" }
jdom2                        = { group = "org.jdom", name = "jdom2", version.ref = "jdom2" }
jackson-databind             = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
junit-jupiter                = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit-jupiter" }
assertj-core                 = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
mockito-core                 = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-inline               = { group = "org.mockito", name = "mockito-inline", version.ref = "mockito-inline" }
mockito-kotlin               = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockito-kotlin" }

[plugins]
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow               = { id = "com.gradleup.shadow", version.ref = "shadow" }
ktlint               = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
